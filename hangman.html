<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>hangman.html</title>
<style>
  body { font-family: monospace; margin: 2em; max-width: 60ch; }
</style>
</head>
<body>

<h1>hangman.py</h1>
<p>A guessing game about Valve game universe. Guess the word one letter at a time.</p>

<pre id="screen"></pre>

<form id="guess-form">
  <label for="guess">Guess a letter:</label>
  <input id="guess" name="guess" maxlength="1" size="2" autocomplete="off" autofocus />
  <button type="submit">Enter</button>
</form>

<p><button type="button" id="new-game">New game</button></p>

<script>
const WORDS = [
  {word: "portal",    hint: "You fell into science"},
  {word: "alyx",      hint: "Half-Life VR game"},
  {word: "dota",      hint: "Defense of the Ancients"},
  {word: "inferno",   hint: "Classic CS map"},
  {word: "dusttwo",   hint: "Most played CS map ever"},
  {word: "medic",     hint: "TF2 class that heals"},
  {word: "heavy",     hint: "TF2's slowest class"},
  {word: "scout",     hint: "TF2's fastest class"},
  {word: "engineer",  hint: "TF2 builder class"},
  {word: "gordon",    hint: "Half-Life protagonist"},
  {word: "glados",    hint: "Portal's evil AI"},
  {word: "wheatley",  hint: "Portal 2 robot companion"},
  {word: "chell",     hint: "Portal's silent protagonist"},
  {word: "combine",   hint: "Half-Life 2 alien empire"},
  {word: "gman",      hint: "Half-Life's iconic enemy"},
  {word: "crowbar",   hint: "Gordon Freeman's weapon"},
  {word: "aperture",  hint: "Portal's science company"},
  {word: "blackmesa", hint: "Half-Life research facility"},
  {word: "boomer",    hint: "L4D explosive special infected"},
  {word: "smoker",    hint: "L4D tongue-grabbing infected"},
  {word: "nuke",      hint: "My favorite map!"},
];

const STAGES = [
`  +---+
  |   |
      |
      |
      |
      |
=========`,
`  +---+
  |   |
  O   |
      |
      |
      |
=========`,
`  +---+
  |   |
  O   |
  |   |
      |
      |
=========`,
`  +---+
  |   |
  O   |
 /|   |
      |
      |
=========`,
`  +---+
  |   |
  O   |
 /|\\  |
      |
      |
=========`,
`  +---+
  |   |
  O   |
 /|\\  |
 /    |
      |
=========`,
`  +---+
  |   |
  O   |
 /|\\  |
 / \\  |
      |
=========`,
];

const MAX_WRONG = STAGES.length - 1;

const screen = document.getElementById("screen");
const form = document.getElementById("guess-form");
const input = document.getElementById("guess");

let word, hint, guessed, wrong, gameOver;

function newGame() {
  const entry = WORDS[Math.floor(Math.random() * WORDS.length)];
  word = entry.word;
  hint = entry.hint;
  guessed = new Set();
  wrong = [];
  gameOver = false;
  input.disabled = false;
  render();
  input.focus();
}

function maskedWord() {
  return word
    .split("")
    .map(letter => (guessed.has(letter) ? letter : "_"))
    .join(" ");
}

function render(message) {
  const lines = [
    STAGES[wrong.length],
    "",
    "Hint:   " + hint,
    "Word:   " + maskedWord(),
    "Missed: " + (wrong.join(" ") || "(none)"),
    "Guesses left: " + (MAX_WRONG - wrong.length),
  ];
  if (message) lines.push("", message);
  screen.textContent = lines.join("\n");
}

function guess(letter) {
  if (gameOver) return;
  if (!/^[a-z]$/.test(letter)) {
    render("Please enter a single letter.");
    return;
  }
  if (guessed.has(letter) || wrong.includes(letter)) {
    render("You already guessed '" + letter + "'.");
    return;
  }

  if (word.includes(letter)) {
    guessed.add(letter);
    if (word.split("").every(l => guessed.has(l))) {
      endGame("You win! The word was '" + word + "'.");
    } else {
      render("'" + letter + "' is in the word.");
    }
  } else {
    wrong.push(letter);
    if (wrong.length === MAX_WRONG) {
      endGame("Game over. The word was '" + word + "'.");
    } else {
      render("'" + letter + "' is not in the word.");
    }
  }
}

function endGame(message) {
  gameOver = true;
  word.split("").forEach(l => guessed.add(l));
  input.disabled = true;
  render(message);
}

form.addEventListener("submit", event => {
  event.preventDefault();
  const letter = input.value.trim().toLowerCase();
  input.value = "";
  guess(letter);
});

document.getElementById("new-game").addEventListener("click", newGame);

newGame();
</script>
</body>
</html>
